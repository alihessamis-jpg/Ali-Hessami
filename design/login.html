<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nephron — Sign in (target design)</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#061838;color:#fff;font-family:'Plus Jakarta Sans',sans-serif;overflow-x:hidden}
input,button{font:inherit}
.g1,.g2{position:fixed;border-radius:50%;pointer-events:none}
.g1{width:420px;height:420px;background:radial-gradient(circle,rgba(46,110,240,.6),rgba(46,110,240,0) 68%);top:-140px;left:-140px;animation:d1 12s ease-in-out infinite}
.g2{width:360px;height:360px;background:radial-gradient(circle,rgba(90,210,255,.35),rgba(90,210,255,0) 68%);bottom:60px;right:-150px;animation:d2 14s ease-in-out infinite}
.wrap{position:relative;min-height:100vh;display:grid;grid-template-rows:auto 1fr;max-width:1100px;margin:0 auto}
.vis{position:relative;height:300px}
.vis svg{position:absolute;inset:0;width:100%;height:100%;opacity:.6}
.side{display:flex;flex-direction:column;justify-content:flex-end;gap:22px;padding:0 20px 40px}
.brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;letter-spacing:.14em;color:#9CC2FF;animation:rise .7s cubic-bezier(.2,.8,.2,1) .1s both}
h1{margin:0;font-size:38px;line-height:1.08;font-weight:800;letter-spacing:-.03em;animation:rise .7s cubic-bezier(.2,.8,.2,1) .22s both}
.lead{margin:0;font-size:15px;color:#B7C9EA;animation:rise .7s cubic-bezier(.2,.8,.2,1) .34s both}
form{display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:26px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);animation:rise .8s cubic-bezier(.2,.8,.2,1) .46s both}
label{font-size:13px;font-weight:600;color:#D3E0F7}
input{height:50px;border-radius:14px;border:1px solid rgba(255,255,255,.2);background:rgba(6,24,56,.5);color:#fff;padding:0 14px;font-size:15px}
input::placeholder{color:#8EA3C6}
.go{position:relative;overflow:hidden;margin-top:6px;height:52px;border-radius:16px;background:#1E5BD8;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;text-decoration:none;box-shadow:0 10px 30px rgba(30,91,216,.45)}
.go:before{content:"";position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.28),rgba(255,255,255,0));animation:shine 3s ease-in-out 1.4s infinite;left:0}
.forgot{align-self:center;font-size:13px;padding:10px;color:#9CC2FF;text-decoration:none}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes flow{to{stroke-dashoffset:-56}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes d1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-24px) scale(1.1)}}
@keyframes d2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-26px,30px) scale(1.08)}}
@keyframes shine{from{transform:translateX(-120%)}to{transform:translateX(320%)}}
@media (min-width:768px){
 .wrap{grid-template-rows:none;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:center;gap:48px;padding:48px}
 .vis{height:min(70vh,560px)}
 .vis svg{opacity:.9}
 .side{padding:0;justify-content:center}
 h1{font-size:48px}
 form{padding:26px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head>
<body><div class="g1"></div><div class="g2"></div>
<div class="wrap">
<div class="vis"><svg viewBox="0 0 390 420" fill="none" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
<g style="transform-box:fill-box;transform-origin:center;animation:beat 2.6s ease-in-out infinite"><circle cx="90" cy="110" r="34" stroke="#3E73D6" stroke-width="2"/>
<path d="M70 100c6-14 22-14 26-4s-14 10-8 22 22 4 22-10M74 124c10 6 28 4 32-10" stroke="#9CC2FF" stroke-width="2.4" stroke-linecap="round"/></g>
<path d="M126 96C146 60 166 118 186 80S216 50 236 76L268 300Q286 334 304 300L322 120C330 90 350 130 360 100" stroke="#1D4A9E" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M126 96C146 60 166 118 186 80S216 50 236 76L268 300Q286 334 304 300L322 120C330 90 350 130 360 100" stroke="#7FD4FF" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="6 8" style="animation:flow 1.8s linear infinite"/>
</svg></div>
<div class="side">
<div style="display:flex;flex-direction:column;gap:10px">
<div class="brand"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#9CC2FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3C5 3 3 7 3 11s2 9 6 9c2.5 0 3-2.5 2-4.5-.6-1.4-.6-2.8 0-4 1-2 2.5-3 2.5-5S12 3 9 3z"/></svg>NEPHRON</div>
<h1>Your nephrology residency, in one place.</h1>
<p class="lead">Patients, case log, study and research — synced.</p>
</div>
<form>
<label for="email">Email</label><input id="email" type="email" placeholder="you@example.com">
<label for="pw">Password</label><input id="pw" type="password" placeholder="••••••••">
<a class="go" href="dashboard.html">Sign in</a>
<a class="forgot" href="#">Forgot password?</a>
</form>
</div>
</div></body></html>
