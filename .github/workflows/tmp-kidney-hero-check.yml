name: tmp kidney hero check
on:
  push:
    branches: [claude/kidney-hero]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: dummy
      - run: tar czf three-pkg.tgz node_modules/three/build node_modules/three/examples/jsm/loaders/GLTFLoader.js node_modules/three/examples/jsm/environments/RoomEnvironment.js node_modules/three/examples/jsm/utils/BufferGeometryUtils.js node_modules/three/package.json
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-pkg
          path: three-pkg.tgz
