name: tmp kidney hero check
on:
  push:
    branches: [claude/kidney-hero]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: dummy
      - name: publish three build to a scratch branch
        run: |
          mkdir -p /tmp/pkg && cp -r node_modules/three/build node_modules/three/package.json /tmp/pkg/
          mkdir -p /tmp/pkg/jsm && cp node_modules/three/examples/jsm/loaders/GLTFLoader.js node_modules/three/examples/jsm/environments/RoomEnvironment.js /tmp/pkg/jsm/
          cp node_modules/three/examples/jsm/utils/BufferGeometryUtils.js /tmp/pkg/jsm/
          cd /tmp/pkg && git init -q && git checkout -q -b tmp/three-pkg && git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm pkg
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" tmp/three-pkg
